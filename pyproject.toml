[project]
name = "ct-segmentation-web"
version = "1.0.0"
description = "Spleen CT segmentation: trained in GitHub Actions, evaluated per patient, served in the browser with ONNX Runtime Web"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dhruv Sanghavi" }]
dependencies = ["numpy>=1.26", "scipy>=1.11", "nibabel>=5.2", "pillow>=10"]

[project.optional-dependencies]
train = ["torch==2.5.1", "onnx==1.17.0", "onnxruntime==1.20.1"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["medseg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
